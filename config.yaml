# ==========================================================================
#  Конфигурация мониторинга судебных дел (ГАС «Правосудие», мировые судьи)
# ==========================================================================

# Статьи КоАП. Совпадение по префиксу номера статьи:
#   "12.8"  -> поймает и 12.8, и 12.8 ч.1, и 12.8 ч.3 КоАП РФ
#   "12.26" -> поймает 12.26 ч.1 и т.д.
articles:
  - "12.8"    # управление ТС в состоянии опьянения
  - "12.26"   # отказ от медосвидетельствования
  - "20.20"   # распитие алкоголя в общественных местах
  - "6.9"     # потребление наркотических средств

# География поиска
region: "Пермский край"
city: "Пермь"
court_type: "Мировой судья"

# Список судебных участков г. Перми.
# Пустой список []  -> искать по ВСЕМ участкам города.
# Пример сужения: ["1", "2", "5"] -> только участки №1, №2, №5.
districts: []

# Глубина поиска по дате: искать заседания за последние N дней
# и все предстоящие (будущие).
lookback_days: 7

# Периодичность опроса ГАС «Правосудие», минуты
poll_interval_minutes: 60

# Канал уведомлений. chat_id берётся из .env (ADMIN_CHAT_ID),
# значение ниже — запасное.
notify:
  channel: telegram
  chat_id: null

# Параметры скрейпера
scraper:
  headless: true            # false — для ручной отладки на VPS (видно браузер)
  timeout_ms: 30000         # таймаут ожидания элементов
  delay_min_between_requests: 1.5   # секунды, нижняя граница случайной паузы
  delay_max_between_requests: 3.5   # секунды, верхняя граница
  max_pages: 20             # предохранитель от зацикливания пагинации
  screenshot_on_error: true # сохранять скриншот в logs/ при сбое парсинга
